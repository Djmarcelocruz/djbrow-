<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0508">
<title>O Pacto de Prazer — Edição Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-primary: #0a0508;
    --bg-secondary: #12090f;
    --bg-card: #1a0f16;
    --bg-glass: rgba(255, 255, 255, 0.03);
    --accent-primary: #ff2a6d;
    --accent-glow: rgba(255, 42, 109, 0.4);
    --text-main: #e0e0e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg-primary);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Cronômetro e Mídia no Modal */
  .challenge-media {
    width: 100%;
    max-height: 350px;
    margin-bottom: 20px;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    border: 1px solid var(--accent-primary);
  }
  .challenge-media img, .challenge-media video { width: 100%; height: 100%; object-fit: cover; }

  .timer-box {
    margin-top: 30px;
    padding: 20px;
    background: var(--bg-glass);
    border-radius: 20px;
    text-align: center;
    border: 1px solid rgba(255, 42, 109, 0.2);
  }

  .timer-display {
    font-family: 'Cinzel', serif;
    font-size: 5rem;
    color: var(--accent-primary);
    text-shadow: 0 0 20px var(--accent-glow);
    font-variant-numeric: tabular-nums;
  }

  .timer-controls { display: flex; gap: 15px; margin-top: 15px; justify-content: center; }

  .btn-timer {
    background: transparent;
    border: 2px solid var(--accent-primary);
    color: white;
    padding: 10px 25px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
  }

  .btn-timer:hover { background: var(--accent-primary); box-shadow: 0 0 15px var(--accent-glow); }

  /* Estilos da Roda e Interface (Resumidos para o exemplo) */
  .wheel-container { position: relative; width: 450px; height: 450px; margin: 20px; }
  canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
  
  .spin-btn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90px; height: 90px; background: var(--accent-primary);
    border: 4px solid white; border-radius: 50%; color: white;
    font-weight: bold; cursor: pointer; z-index: 10;
  }

  /* Modais */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    z-index: 100; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-content {
    background: var(--bg-card); padding: 40px; border-radius: 24px;
    max-width: 800px; width: 95%; text-align: center; border: 1px solid var(--accent-primary);
  }
</style>
</head>
<body>

  <div class="wheel-container">
    <canvas id="wheelCanvas" width="500" height="500"></canvas>
    <button class="spin-btn" onclick="spinWheel()">GIRAR</button>
  </div>

  <div id="resultModal" class="modal">
    <div class="modal-content">
      <div id="mediaArea" class="challenge-media"></div>
      <h1 id="challengeTitle" style="font-family: 'Cinzel'; color: var(--accent-primary); margin-bottom: 20px;"></h1>
      <p id="challengeDesc" style="font-size: 1.5rem; line-height: 1.4;"></p>
      
      <div id="timerArea" class="timer-box" style="display: none;">
        <div id="timerDisplay" class="timer-display">00:00</div>
        <div class="timer-controls">
          <button class="btn-timer" onclick="toggleTimer()" id="playPauseBtn">PLAY</button>
          <button class="btn-timer" onclick="resetTimer()">RESET</button>
        </div>
      </div>
      
      <button onclick="closeModal()" style="margin-top: 30px; padding: 15px 40px; background: white; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;">FECHAR</button>
    </div>
  </div>

<script>
  // Lógica do Cronômetro
  let timerInterval;
  let timeLeft = 0;
  let initialTime = 0;
  let isPaused = true;

  function setupTimer(seconds) {
    clearInterval(timerInterval);
    initialTime = seconds;
    timeLeft = seconds;
    isPaused = true;
    document.getElementById('playPauseBtn').innerText = "PLAY";
    updateTimerDisplay();
    document.getElementById('timerArea').style.display = seconds > 0 ? 'block' : 'none';
  }

  function toggleTimer() {
    const btn = document.getElementById('playPauseBtn');
    if (isPaused) {
      isPaused = false;
      btn.innerText = "PAUSAR";
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          alert("Tempo esgotado!");
        }
      }, 1000);
    } else {
      isPaused = true;
      btn.innerText = "CONTINUAR";
      clearInterval(timerInterval);
    }
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timeLeft = initialTime;
    isPaused = true;
    document.getElementById('playPauseBtn').innerText = "PLAY";
    updateTimerDisplay();
  }

  function updateTimerDisplay() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').innerText = `${m}:${s}`;
  }

  // Lógica de Mídia
  function showMedia(url) {
    const area = document.getElementById('mediaArea');
    area.innerHTML = '';
    area.style.display = 'none';
    if (!url) return;

    area.style.display = 'block';
    if (url.includes('.mp4')) {
      area.innerHTML = `<video src="${url}" autoplay loop muted></video>`;
    } else {
      area.innerHTML = `<img src="${url}">`;
    }
  }

  // Funções de Roda (Simplificadas para o modelo)
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const items = ["Desafio 1", "Desafio 2", "Especial", "Pimenta"];
  let startAngle = 0;
  const arc = Math.PI / (items.length / 2);

  function drawWheel() {
    items.forEach((text, i) => {
      const angle = startAngle + i * arc;
      ctx.fillStyle = i % 2 === 0 ? "#1a0f16" : "#ff2a6d";
      ctx.beginPath(); ctx.moveTo(250, 250);
      ctx.arc(250, 250, 250, angle, angle + arc, false);
      ctx.fill(); ctx.save();
      ctx.fillStyle = "white"; ctx.translate(250 + Math.cos(angle + arc/2)*180, 250 + Math.sin(angle + arc/2)*180);
      ctx.rotate(angle + arc/2 + Math.PI/2); ctx.fillText(text, -ctx.measureText(text).width/2, 0);
      ctx.restore();
    });
  }

  function spinWheel() {
    const spinAngle = Math.random() * 10 + 10;
    let currentSpin = 0;
    const interval = setInterval(() => {
      startAngle += 0.2; drawWheel(); currentSpin += 0.1;
      if(currentSpin > spinAngle) {
        clearInterval(interval);
        // Exemplo de chamada do modal
        showResult("Desafio Sorteado", "Este é um exemplo de desafio para sua TV.", 60, "");
      }
    }, 20);
  }

  function showResult(title, desc, seconds, mediaUrl) {
    document.getElementById('challengeTitle').innerText = title;
    document.getElementById('challengeDesc').innerText = desc;
    showMedia(mediaUrl);
    setupTimer(seconds);
    document.getElementById('resultModal').style.display = 'flex';
  }

  function closeModal() {
    clearInterval(timerInterval);
    document.getElementById('resultModal').style.display = 'none';
  }

  drawWheel();
</script>
</body>
</html>
