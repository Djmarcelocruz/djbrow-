<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>O Pacto de Prazer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>O Pacto de Prazer</h1>
            <p>Edição Profissional</p>
        </header>

        <div class="game-area">
            <div class="players">
                <div class="card" id="cardF" onclick="selectPlayer('F')">
                    <h3>Soberana</h3>
                    <div class="pts" id="pointsF">0</div>
                </div>
                <div class="card" id="cardM" onclick="selectPlayer('M')">
                    <h3>Submisso</h3>
                    <div class="pts" id="pointsM">0</div>
                </div>
            </div>

            <div class="wheel-box">
                <div class="wheel" id="wheel">★</div>
                <button class="spin-btn" id="spinBtn" onclick="spinWheel()">GIRAR O DESTINO</button>
            </div>

            <div id="challengeDisplay" class="challenge-text">Selecione quem joga e gire a roda...</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
