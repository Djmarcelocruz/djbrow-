<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0508">
<title>O Pacto de Prazer — Edição Pro</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0508; --bg-secondary: #12090f; --bg-card: #1a0f16;
    --accent-primary: #ff2a6d; --accent-secondary: #ff7eb3; --gold-primary: #ffd700;
    --male-primary: #4a90e2; --text-primary: #ffffff; --radius-md: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); overflow: hidden; height: 100vh; }
  .app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  .header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .logo { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--accent-secondary); }
  .players-bar { display: flex; gap: 10px; padding: 10px; }
  .player-card { flex: 1; background: var(--bg-card); border: 2px solid transparent; border-radius: var(--radius-md); padding: 10px; text-align: center; }
  .active-f { border-color: var(--accent-primary); box-shadow: 0 0 15px var(--accent-primary); }
  .active-m { border-color: var(--male-primary); box-shadow: 0 0 15px var(--male-primary); }
  .wheel-container { position: relative; width: 220px; height: 220px; margin: 20px auto; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ff2a6d 0deg 90deg, #ffd700 90deg 180deg, #4a90e2 180deg 270deg, #9b59b6 270deg 360deg); transition: transform 3s cubic-bezier(0.1, 1, 0.2, 1); border: 4px solid #333; }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid var(--gold-primary); z-index: 10; }
  .spin-btn { width: 90%; margin: 0 auto; padding: 18px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: #fff; font-weight: bold; font-family: 'Cinzel'; cursor: pointer; text-transform: uppercase; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; flex-direction: column; padding: 20px; z-index: 1000; justify-content: center; }
  .modal.show { display: flex; }
  .modal-content { background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
  .timer { font-family: 'Cinzel'; font-size: 3.5rem; color: var(--accent-primary); margin: 15px 0; }
  .btn { padding: 16px; border-radius: 8px; border: none; font-weight: bold; margin-top: 12px; cursor: pointer; width: 100%; text-transform: uppercase; }
  .btn-primary { background: var(--accent-primary); color: white; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="app">
    <header class="header"><div class="logo">O Pacto de Prazer</div></header>
    <div class="players-bar">
      <div id="cardF" class="player-card active-f">Soberana<br><b id="ptsF">0</b> pts</div>
      <div id="cardM" class="player-card">Submisso<br><b id="ptsM">0</b> pts</div>
    </div>
    <div class="wheel-container">
      <div class="pointer"></div>
      <div id="wheel" class="wheel"></div>
    </div>
    <button id="spinBtn" class="spin-btn" onclick="spin()">Sortear Desafio</button>
  </div>

  <div id="modalChallenge" class="modal">
    <div class="modal-content">
      <h2 id="chTitle" style="font-family:'Cinzel';color:var(--accent-secondary)"></h2>
      <p id="chText" style="margin:20px 0;line-height:1.6;color:#ddd"></p>
      <button class="btn btn-primary" onclick="startDoing()">Aceitar</button>
      <button class="btn" style="background:#333;color:#ccc" onclick="closeModal('modalChallenge')">Recusar</button>
    </div>
  </div>

  <div id="modalDoing" class="modal">
    <div class="modal-content">
      <h2 id="doTitle" style="font-family:'Cinzel'"></h2>
      <div id="timerSection"><div id="timerDisplay" class="timer">00:00</div></div>
      <p id="doText" style="margin-bottom:20px;color:#ddd"></p>
      <button class="btn" style="background:#27ae60;color:white" onclick="completeChallenge()">Concluir</button>
    </div>
  </div>

<script>
// CONFIGURAÇÃO DOS DESAFIOS (MANTENDO SUA LÓGICA)
const challengesPool = {
  F: [{ title: "O PRIVILÉGIO DA POSSE", text: "Ele deve roçar o pênis com carinho no seu clitóris, proibido penetrar...", time: 180 }],
  M: [{ title: "A ENTREGA", text: "Massageie os pés dela com óleo por 5 minutos...", time: 300 }]
};

let state = { turn: 'F', activeChallenge: null, timer: null, timeLeft: 0 };

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function spin() {
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  const deg = Math.floor(Math.random() * 360) + 1440;
  document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;
  setTimeout(() => {
    state.activeChallenge = challengesPool[state.turn][0]; // Lógica de sorteio
    document.getElementById('chTitle').innerText = state.activeChallenge.title;
    document.getElementById('chText').innerText = state.activeChallenge.text;
    openModal('modalChallenge');
    btn.disabled = false;
  }, 3100);
}

// CORREÇÃO DEFINITIVA: Onde travava a tela
function startDoing() {
  closeModal('modalChallenge');
  const ch = state.activeChallenge;
  if (!ch) return;

  document.getElementById('doTitle').innerText = ch.title;
  document.getElementById('doText').innerText = ch.text;

  if (state.timer) clearInterval(state.timer);
  
  if (ch.time > 0) {
    document.getElementById('timerSection').classList.remove('hidden');
    state.timeLeft = ch.time;
    updateUI();
    state.timer = setInterval(() => {
      state.timeLeft--;
      updateUI();
      if (state.timeLeft <= 0) {
        clearInterval(state.timer);
        alert("Tempo esgotado!");
      }
    }, 1000);
  } else {
    document.getElementById('timerSection').classList.add('hidden');
  }
  openModal('modalDoing');
}

function updateUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2,'0');
  const s = (state.timeLeft % 60).toString().padStart(2,'0');
  document.getElementById('timerDisplay').innerText = `${m}:${s}`;
}

function completeChallenge() {
  clearInterval(state.timer);
  closeModal('modalDoing');
  state.turn = state.turn === 'F' ? 'M' : 'F';
  document.getElementById('cardF').classList.toggle('active-f');
  document.getElementById('cardM').classList.toggle('active-m');
}

// Service Worker (Para Github Pages)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
