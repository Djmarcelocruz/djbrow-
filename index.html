<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>O Pacto de Prazer — Edição Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0508; --bg-secondary: #12090f; --bg-card: #1a0f16;
    --accent-primary: #ff2a6d; --accent-secondary: #ff7eb3; --male-primary: #4a90e2;
    --gold-primary: #ffd700; --text-primary: #ffffff; --text-muted: #7a6b7a;
    --radius-md: 12px; --safe-top: env(safe-area-inset-top, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); padding-top: var(--safe-top); overflow: hidden; }
  .app { height: 100vh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; }
  
  /* Header & Bar */
  .header { padding: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .logo { font-family: 'Cinzel', serif; font-size: 1.2rem; color: var(--accent-secondary); }
  .game-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  
  /* Players */
  .players-bar { display: flex; gap: 10px; }
  .player-card { flex: 1; background: var(--bg-card); border: 2px solid transparent; border-radius: var(--radius-md); padding: 10px; text-align: center; }
  .active-f { border-color: var(--accent-primary); box-shadow: 0 0 10px var(--accent-primary); }
  .active-m { border-color: var(--male-primary); box-shadow: 0 0 10px var(--male-primary); }
  
  /* Wheel */
  .wheel-section { text-align: center; padding: 20px 0; }
  .wheel-container { position: relative; width: 200px; height: 200px; margin: 0 auto 20px; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ff2a6d 0% 16%, #ff7eb3 16% 33%, #ffd700 33% 50%, #e74c3c 50% 66%, #9b59b6 66% 83%, #4a90e2 83% 100%); transition: transform 3s cubic-bezier(0.1, 1, 0.2, 1); border: 5px solid #1a0f16; }
  .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--gold-primary); z-index: 10; }

  /* Buttons */
  .spin-btn { width: 100%; padding: 15px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: #fff; font-weight: bold; font-family: 'Cinzel'; cursor: pointer; }
  .spin-btn:disabled { opacity: 0.3; }

  /* Modals */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; padding: 20px; z-index: 100; justify-content: center; text-align: center; }
  .show { display: flex; }
  .timer { font-family: 'Cinzel'; font-size: 3rem; color: var(--accent-primary); margin: 20px 0; }
  .btn { padding: 15px; border-radius: 8px; border: none; font-weight: bold; margin-top: 10px; cursor: pointer; width: 100%; }
  .btn-go { background: var(--accent-primary); color: white; }
  .btn-skip { background: #333; color: #ccc; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <header class="header"><div class="logo">O Pacto de Prazer</div></header>
  
  <div class="game-area">
    <div class="players-bar">
      <div id="cardF" class="player-card active-f">Soberana<br><span id="ptsF">0</span> pts</div>
      <div id="cardM" class="player-card">Submisso<br><span id="ptsM">0</span> pts</div>
    </div>

    <div class="wheel-section">
      <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheel" class="wheel"></div>
      </div>
      <button id="spinBtn" class="spin-btn" onclick="spin()">Sortear Desafio</button>
    </div>
  </div>
</div>

<div id="modalSorteio" class="modal">
  <h2 id="stTitle"></h2>
  <p id="stText" style="margin: 20px 0; line-height: 1.5;"></p>
  <button class="btn btn-go" onclick="startChallenge()">Aceitar e Iniciar</button>
  <button class="btn btn-skip" onclick="closeModals()">Recusar</button>
</div>

<div id="modalExec" class="modal">
  <h2 id="exTitle"></h2>
  <div id="timerContainer">
    <div id="displayTimer" class="timer">00:00</div>
    <button class="btn" id="btnPause" onclick="togglePause()" style="width:auto; padding: 5px 15px;">Pausar</button>
  </div>
  <p id="exText" style="margin: 20px 0;"></p>
  <button class="btn btn-go" onclick="finish()">Concluir Desafio</button>
</div>

<script>
const challenges = {
  F: [{t: "Dominação", d: "Ele deve beijar seus pés por 1 minuto.", time: 60}],
  M: [{t: "Massagem", d: "Massageie as costas dela com vigor.", time: 120}]
};

let state = {
  turn: 'F',
  currentChallenge: null,
  timeLeft: 0,
  timerIdx: null,
  paused: false
};

function spin() {
  const btn = document.getElementById('spinBtn');
  btn.disabled = true;
  
  const deg = Math.floor(Math.random() * 360) + 1440;
  document.getElementById('wheel').style.transform = `rotate(${deg}deg)`;

  setTimeout(() => {
    const list = challenges[state.turn];
    state.currentChallenge = list[Math.floor(Math.random() * list.length)];
    
    document.getElementById('stTitle').innerText = state.currentChallenge.t;
    document.getElementById('stText').innerText = state.currentChallenge.d;
    document.getElementById('modalSorteio').classList.add('show');
    btn.disabled = false;
  }, 3100);
}

function startChallenge() {
  document.getElementById('modalSorteio').classList.remove('show');
  
  const ch = state.currentChallenge;
  document.getElementById('exTitle').innerText = ch.t;
  document.getElementById('exText').innerText = ch.d;
  
  // Reset Timer
  if (state.timerIdx) clearInterval(state.timerIdx);
  state.timeLeft = ch.time;
  state.paused = false;
  
  document.getElementById('modalExec').classList.add('show');
  updateTimerUI();

  state.timerIdx = setInterval(() => {
    if (!state.paused) {
      state.timeLeft--;
      updateTimerUI();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerIdx);
        alert("Tempo esgotado!");
      }
    }
  }, 1000);
}

function updateTimerUI() {
  const m = Math.floor(state.timeLeft / 60).toString().padStart(2, '0');
  const s = (state.timeLeft % 60).toString().padStart(2, '0');
  document.getElementById('displayTimer').innerText = `${m}:${s}`;
}

function togglePause() {
  state.paused = !state.paused;
  document.getElementById('btnPause').innerText = state.paused ? "Retomar" : "Pausar";
}

function finish() {
  clearInterval(state.timerIdx);
  closeModals();
  // Lógica de pontos
  state.turn = state.turn === 'F' ? 'M' : 'F';
  document.getElementById('cardF').classList.toggle('active-f');
  document.getElementById('cardM').classList.toggle('active-m');
}

function closeModals() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('show'));
}
</script>
</body>
</html>
